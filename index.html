<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>INTEGRAL — Hand-Shaped Pottery</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #050607; }
    body { color: #ecebe8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    canvas { display: block; touch-action: none; }
    .controls { position: fixed; left: 50%; bottom: 76px; transform: translateX(-50%); display: flex; gap: 10px; z-index: 11; }
    button { font: inherit; font-size: 11px; letter-spacing: 0.10em; color: #e9e9e4; background: rgba(17,19,21,.88); border: 1px solid #525658; padding: 11px 17px; min-width: 108px; cursor: pointer; transition: background .15s, border-color .15s; }
    button:hover { background: #232628; border-color: #bfc2bf; }
    button:focus-visible { outline: 2px solid #f9f9f6; outline-offset: 2px; }
    .foot { position: fixed; left: 30px; right: 30px; bottom: 18px; padding-top: 12px; border-top: 1px solid rgba(165,165,165,.26); display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center; gap: 6px; color: #a5a9a7; font-size: 10px; letter-spacing: .055em; pointer-events: none; z-index: 10; }
    .foot span:nth-child(2) { text-align: center; } .foot span:nth-child(3) { text-align: right; }
    #error { display: none; position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%); max-width: calc(100% - 36px); padding: 11px 15px; background: #241918; border: 1px solid #9a625a; color: #f3c8c2; font-size: 11px; text-align: center; z-index: 12; }
    @media (max-width: 690px) {
      .controls { bottom: 80px; }
      button { font-size: 10px; min-width: 96px; padding: 10px 12px; }
      .foot { left: 17px; right: 17px; font-size: 8px; }
    }
    @media(max-width:420px){.controls{left:18px;transform:none;flex-direction:column;bottom:76px} .controls button{min-width:88px;padding:10px 8px}}
  </style>
  
</head>
<body>
  <div class="controls"><button id="pauseBtn" type="button">PAUSE [SPACE]</button><button id="resetBtn" type="button">RESET [R]</button></div>
  <div class="foot"><span id="heightInfo">HEIGHT  0 px</span><span id="radiusInfo">RADIUS  48 px</span><span id="layerInfo">LAYERS  0 / 143</span></div>
  <section id="cameraPanel" aria-label="카메라 미리보기 및 연결" lang="ko">
    <div id="cameraViewport"><span id="cameraPlaceholder">카메라 미리보기</span></div>
    <div id="status" aria-live="polite">카메라 대기 중</div>
  </section>
  <div id="error" role="alert"></div>

  <script>
    window.addEventListener('error', e => {
      const el = document.getElementById('error'); el.style.display='block';
      el.textContent = '프로그램 실행 오류: ' + (e.message || '라이브러리 로딩 실패');
    });
    async function boot() {
      function load(src) { return new Promise((resolve,reject) => {
        const tag=document.createElement('script');tag.src=src;
        const timer=setTimeout(()=>{tag.remove();reject(Error('다운로드 시간 초과'));},15000);
        tag.onload=()=>{clearTimeout(timer);resolve();};tag.onerror=()=>{clearTimeout(timer);reject(Error('다운로드 실패'));};
        document.body.appendChild(tag);
      }); }
      try {
        await load('./vendor/p5.min.js');
        await load('./sketch.js');
        new p5();
      } catch(e) {
        document.getElementById('status').textContent='프로그램을 불러오지 못했습니다';
        const el=document.getElementById('error');el.style.display='block';
        el.textContent='프로그램 다운로드에 실패했습니다. 인터넷 연결을 확인하고 새로고침하세요. '+e.message;
      }
    }
    boot();
  </script>

</body>
</html>
